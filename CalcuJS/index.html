<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CalcuJS</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div id="container-gral">
      <div id="calculadora">
        <h1>Calculadora</h1>
        <div id="display">
          <p id="displayText">Hola, bienvenido a CalcuJS.</p>
        </div>
        <div id="teclado">
          <button class="ac">AC</button>
          <button class="n1" value="1">1</button>
          <button class="n2" value="2">2</button>
          <button class="n3" value="3">3</button>
          <button class="n4" value="4">4</button>
          <button class="n5" value="5">5</button>
          <button class="n6" value="6">6</button>
          <button class="n7" value="7">7</button>
          <button class="n8" value="8">8</button>
          <button class="n9" value="9">9</button>
          <button class="n0" value="0">0</button>
          <button class="suma" value="suma">+</button>
          <button class="resta" value="resta">-</button>
          <button class="multi" value="multi">*</button>
          <button class="div" value="div">/</button>
          <button id="enter">Enter</button>
        </div>
      </div>
    </div>
    <script src="app.js"></script>
  </body>
</html>
