<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>App reproductor de Musica</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <section class="reproductor-musica">
        <h1>Titulo</h1>
        <p>Nombre</p>
        <audio id="cancion">
            <source src="" type="audio/mpeg"/>
        </audio>
        <input type="range" value="0" id="progreso"/>
        <div class="controles">
            <button class="btn-atras control">
                <i class="bi bi-rewind-fill"></i>
            </button>
            <button class="btn-iniciar-pausar iconControl" >
                <i class="bi bi-play-btn-fill"  id="iconControl"></i>
            </button>
            
            <button class="btn-siguiente control">
                <i class="bi bi-skip-forward-fill"></i>
            </button>
        </div>
    </section>
    <script src="app.js"></script>
</body>
</html>
